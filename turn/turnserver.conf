# coturn configuration for PeerCast — TURN relay for symmetric-NAT viewers.
#
# *** STATIC-AUTH-SECRET MUST BE CHANGED BEFORE DEPLOYMENT ***
#
# This file is version-controlled. NEVER commit a real secret here.
# Set static-auth-secret below AND TURN_SHARED_SECRET in your .env — the two
# must match. Coturn accepts time-limited credentials derived from the shared
# secret (TURN REST API flow); the PeerCast server issues fresh ones to every
# client via GET /api/config, so no long-term username/password is ever sent.
#
# After editing:
#   1. Set TURN_SHARED_SECRET in your .env (match static-auth-secret below)
#   2. Set ICE_SERVERS in your .env to advertise the relay, e.g.:
#      ICE_SERVERS=[{"urls":"stun:stun.l.google.com:19302"},
#        {"urls":"turn:YOUR_DOMAIN_OR_IP:3478"}]
#      (username/credential are auto-generated when TURN_SHARED_SECRET is set)
#   3. docker compose --profile turn up -d --build

listening-port=3478
# tls-listening-port=5349

# Time-limited credential mechanism (TURN REST API).
# The server derives credentials as:
#   username   = "<unix expiry timestamp>:peercast"
#   credential = base64( HMAC-SHA1( static-auth-secret, username ) )
# Generate a strong secret: openssl rand -hex 24
use-auth-secret
static-auth-secret=CHANGE_ME_TURN_SHARED_SECRET
realm=peercast

# Relay port range — open these UDP ports on your firewall.
min-port=49160
max-port=49200

# Set your server's PUBLIC IP when behind NAT/cloud:
# external-ip=YOUR_PUBLIC_IP

# Recommended hardening for a public relay.
no-cli
no-multicast-peers
stale-nonce=600
fingerprint

# For production, enable TURNS (TLS) by providing certs and enabling these:
# cert=/etc/coturn/cert.pem
# pkey=/etc/coturn/privkey.pem
# tls-listening-port=5349
no-tls
no-dtls

# Comment out verbose once you have validated the relay is working.
# verbose
